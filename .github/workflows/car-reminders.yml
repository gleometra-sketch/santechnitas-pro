name: Automobilių priminimai

on:
  schedule:
    - cron: '0 5 * * *' # 07:00 žiemą, 08:00 vasarą (UTC laikas)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Iškviesti priminimų maršrutą
        run: |
          # Nepavykus (401, 307 į prisijungimą, 500) darbas turi baigtis klaida, o ne tyliai.
          code=$(curl -sS -o response.txt -w "%{http_code}" -X POST "${{ secrets.APP_URL }}/api/cars/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.txt; echo
          test "$code" = "200"
